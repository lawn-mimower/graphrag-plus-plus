[pytest]
testpaths = tests
pythonpath = .
# The live test calls the Gemini API; run it explicitly with: pytest -m e2e
addopts = -m "not e2e"
markers =
    e2e: live end-to-end run against the Gemini API (needs GOOGLE_API_KEY)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
